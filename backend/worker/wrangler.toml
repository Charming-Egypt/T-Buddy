# Travel Buddy payments Worker.   cd backend/worker && npx wrangler deploy
name = "travel-buddy-payments"
main = "payments-worker.js"
compatibility_date = "2026-01-01"
# routes = [{ pattern = "pay.YOURDOMAIN.com/*", zone_name = "YOURDOMAIN.com" }]

[vars]
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
KASHIER_MERCHANT_ID = "MID-xxxx-xx"          # from the Kashier dashboard
KASHIER_MODE = "test"                         # switch to "live" when Kashier approves your account
PAY_CURRENCY = "EGP"                          # currency the card is charged in (must be enabled on your Kashier account)
USD_TO_PAY_RATE = ""                          # e.g. "48.5" to fix the rate; leave empty to use a live rate (ignored if PAY_CURRENCY = USD)
SITE_URL = "https://www.YOURDOMAIN.com"       # where customers return to
ALLOWED_ORIGINS = "https://www.YOURDOMAIN.com"

# Secrets — set with:  npx wrangler secret put NAME
#   SUPABASE_SERVICE_ROLE_KEY   (Supabase → Settings → API → service_role)   NEVER put this in the website
#   KASHIER_API_KEY             (Kashier → Integrations → Payment API key)
#   KASHIER_SECRET_KEY          (optional, Kashier secret key — accepted for signature checks)
